services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: 30studio
      POSTGRES_USER: 30studio
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the ignored .env file}
    volumes:
      - 30studio_dev_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 30studio -d 30studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:2026.10.7
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PERSISTENCE: "0"
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q available"]
      interval: 5s
      timeout: 3s
      retries: 30
    profiles: ["media", "social"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://30studio:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the ignored .env file}@postgres:5432/30studio
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  initialize-storage:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "storage:dev:init"]
    environment:
      NODE_ENV: development
      STUDIO_ASSET_BUCKET: 30studio-media
      STUDIO_ASSET_REGION: us-east-1
      STUDIO_ASSET_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"
    profiles: ["media", "social"]

  seed-local-user:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "db:seed:local"]
    environment:
      NODE_ENV: development
      STUDIO_LOCAL_DEVELOPMENT: "true"
      DATABASE_URL: postgres://30studio:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the ignored .env file}@postgres:5432/30studio
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  seed-demo-data:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "db:seed:demo"]
    environment:
      NODE_ENV: development
      STUDIO_LOCAL_DEVELOPMENT: "true"
      DATABASE_URL: postgres://30studio:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the ignored .env file}@postgres:5432/30studio
      STUDIO_ASSET_BUCKET: 30studio-media
      STUDIO_ASSET_REGION: us-east-1
      STUDIO_ASSET_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      seed-local-user:
        condition: service_completed_successfully
      initialize-storage:
        condition: service_completed_successfully
    profiles: ["demo-data"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://30studio:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the ignored .env file}@postgres:5432/30studio
      STUDIO_PUBLIC_ORIGIN: http://localhost:${STUDIO_LOCAL_PORT:-3000}
      SOCIAL_PUBLISHING_ENABLED: ${SOCIAL_PUBLISHING_ENABLED:-false}
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      META_CLIENT_ID: ${META_CLIENT_ID:-}
      META_CLIENT_SECRET: ${META_CLIENT_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v27.0}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      X_CLIENT_ID: ${X_CLIENT_ID:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in the ignored .env file}
      BETTER_AUTH_URL: http://localhost:${STUDIO_LOCAL_PORT:-3000}
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:${STUDIO_LOCAL_PORT:-3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      STUDIO_ASSET_BUCKET: 30studio-media
      STUDIO_ASSET_REGION: us-east-1
      STUDIO_ASSET_ENDPOINT: ${STUDIO_ASSET_ENDPOINT:-http://localstack:4566}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:${STUDIO_LOCAL_PORT:-3000}:3000"
    volumes:
      - .:/app
      - 30studio_dev_node_modules:/app/node_modules
      - 30studio_dev_next:/app/.next
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed-local-user:
        condition: service_completed_successfully

  media-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "worker:content-media"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://30studio:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the ignored .env file}@postgres:5432/30studio
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STUDIO_ASSET_BUCKET: 30studio-media
      STUDIO_ASSET_REGION: us-east-1
      STUDIO_ASSET_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - .:/app
      - 30studio_dev_node_modules:/app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      initialize-storage:
        condition: service_completed_successfully
    profiles: ["media"]

  social-publishing-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "worker:social-publishing"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://30studio:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the ignored .env file}@postgres:5432/30studio
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY:-}
      SOCIAL_PUBLISHING_ENABLED: ${SOCIAL_PUBLISHING_ENABLED:-false}
      META_CLIENT_ID: ${META_CLIENT_ID:-}
      META_CLIENT_SECRET: ${META_CLIENT_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v27.0}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-}
      STUDIO_ASSET_BUCKET: 30studio-media
      STUDIO_ASSET_REGION: us-east-1
      STUDIO_ASSET_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      migrate:
        condition: service_completed_successfully
      initialize-storage:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["social"]

  competitor-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "worker:competitors"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://30studio:${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD in the ignored .env file}@postgres:5432/30studio
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["competitors"]

volumes:
  30studio_dev_postgres:
  30studio_dev_node_modules:
  30studio_dev_next:
